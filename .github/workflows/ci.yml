name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - name: Validate Actor JSON files
        run: node -e "for (const path of ['.actor/actor.json', '.actor/dataset_schema.json', '.actor/output_schema.json', 'INPUT_SCHEMA.json', 'input.json']) JSON.parse(require('fs').readFileSync(path, 'utf8'))"
